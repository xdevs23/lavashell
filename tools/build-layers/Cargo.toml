# SPDX-License-Identifier: GPL-3.0-only
[workspace]
members = ["aosp-library-check", "cargo-model", "command-output", "nix-tests", "plan-check", "projection-refresh"]
default-members = ["aosp-library-check", "cargo-model", "command-output", "plan-check", "projection-refresh"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unused_results = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes = "deny"
disallowed_methods = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
lavashell-aosp-library-check = { path = "aosp-library-check" }
lavashell-cargo-model = { path = "cargo-model" }
lavashell-command-output = { path = "command-output" }
lavashell-enum-values = { path = "../../crates/lavashell-enum-values" }
lavashell-nix-tests = { path = "nix-tests" }
lavashell-plan-check = { path = "plan-check" }
lavashell-projection-refresh = { path = "projection-refresh" }
cargo-util-schemas = "=0.15.0"
clap = { version = "=4.6.7", features = ["derive"] }
object = { version = "=0.41.0", default-features = false, features = ["elf", "names", "read_core", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.1", default-features = false }
syn = { version = "=3.0.6", default-features = false, features = ["full", "parsing", "visit"] }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=1.1.6"
url = "=2.5.8"
